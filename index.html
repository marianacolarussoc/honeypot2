<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Inspiration Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
/* ── Reset ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; color: #111827; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

/* ── Layout ──────────────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────────── */
#sidebar {
  width: 264px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: #fff; border-right: 1px solid #E5E7EB;
  overflow: hidden;
}
#sidebar-top {
  padding: 14px 12px 10px; border-bottom: 1px solid #F1F5F9; flex-shrink: 0;
}
#logo {
  display: flex; align-items: center; gap: 8px; margin-bottom: 11px;
}
#logo-text { font-size: 14px; font-weight: 700; color: #0F766E; }
#search-wrap { position: relative; }
#search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: #9CA3AF; pointer-events: none;
}
#search {
  width: 100%; padding: 7px 10px 7px 30px;
  font-size: 12px; font-family: inherit; color: #374151;
  background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; outline: none;
}
#search:focus { border-color: #99F6E4; background: #fff; }
#company-list { flex: 1; overflow-y: auto; padding: 6px 0; }
#switch-link {
  flex-shrink: 0; margin: 8px 10px 10px;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 10px; border-radius: 9px;
  background: #F0FDFA; border: 1px solid #CCFBF1;
  text-decoration: none; color: #0F766E; font-size: 12px; font-weight: 600;
  transition: background .15s;
}
#switch-link:hover { background: #CCFBF1; }
#switch-link-label { flex: 1; }

/* Industry groups */
.ind-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 12px 4px; cursor: pointer; user-select: none;
}
.ind-header:hover { background: #F9FAFB; }
.ind-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: #9CA3AF;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.ind-chevron { font-size: 9px; color: #D1D5DB; transition: transform .15s; flex-shrink: 0; }
.ind-chevron.open { transform: rotate(90deg); }

.company-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 5px 12px 5px 20px;
  font-size: 12px; font-weight: 500; color: #374151;
  background: none; border: none; border-left: 2px solid transparent;
  cursor: pointer; text-align: left; transition: background .1s;
}
.company-btn:hover { background: #F0FDFA; color: #0F766E; }
.company-btn.active { background: #F0FDFA; color: #0F766E; border-left-color: #0F766E; font-weight: 600; }
.company-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.company-count {
  font-size: 11px; font-weight: 600; color: #9CA3AF;
  background: #F1F5F9; border-radius: 99px; padding: 1px 7px;
  min-width: 22px; text-align: center; flex-shrink: 0;
}
.company-btn.active .company-count { background: #CCFBF1; color: #0F766E; }
.all-btn { padding-left: 12px; font-weight: 600; }

/* ── Main ────────────────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#main-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px; border-bottom: 1px solid #F1F5F9;
  background: #fff; flex-shrink: 0;
}
#main-title { font-size: 15px; font-weight: 700; color: #111827; }
#main-sub { font-size: 11px; color: #9CA3AF; margin-top: 2px; display: none; }
#count-label { font-size: 12px; color: #9CA3AF; font-weight: 500; white-space: nowrap; }
#feed-wrap { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Cards ───────────────────────────────────────────────────────── */
.cards-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.card {
  background: #fff; border: 1px solid #E5E7EB; border-radius: 12px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  transition: box-shadow .15s, transform .15s;
  animation: fadeUp .2s ease;
}
.card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.10); transform: translateY(-2px); }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card-thumb { background: #F8FAFC; border-bottom: 1px solid #F1F5F9; overflow: hidden; max-height: 220px; }
.card-thumb img { width: 100%; display: block; object-fit: cover; object-position: top; }
.card-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.card-brand { font-size: 13px; font-weight: 700; color: #111827; }
.card-date { font-size: 11px; color: #9CA3AF; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.pill {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 7px; border-radius: 99px;
  background: #F0FDFA; color: #0F766E; white-space: nowrap;
}
.card-subject {
  font-size: 12px; font-weight: 600; color: #111827; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-preview { font-size: 11px; color: #6B7280; line-height: 1.55; flex: 1; }
.card-actions { padding-top: 10px; border-top: 1px solid #F1F5F9; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn-ghost {
  display: inline-flex; align-items: center; gap: 5px;
  color: #0F766E; background: #F0FDFA; border: 1px solid #99F6E4;
  border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500;
  padding: 6px 12px; text-decoration: none; white-space: nowrap;
  font-family: inherit; transition: background .15s;
}
.btn-ghost:hover { background: #CCFBF1; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 5px;
  background: #0F766E; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; font-size: 12px; font-weight: 600; padding: 7px 14px;
  text-decoration: none; white-space: nowrap; font-family: inherit;
  transition: background .15s;
}
.btn-primary:hover { background: #0D6460; }

/* ── Skeleton ────────────────────────────────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -600px 0; }
  100% { background-position:  600px 0; }
}
.skel {
  background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
  background-size: 1200px 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 6px;
}

/* ── Modal ───────────────────────────────────────────────────────── */
#modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
  z-index: 100; align-items: center; justify-content: center; padding: 20px;
}
#modal-bg.open { display: flex; }
#modal-box {
  background: #fff; border-radius: 16px;
  width: 100%; max-width: 700px; max-height: 90vh;
  overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.22);
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.96) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 20px 20px 16px; border-bottom: 1px solid #F1F5F9;
  position: sticky; top: 0; background: #fff; z-index: 1;
}
.modal-header-info { flex: 1; min-width: 0; }
.modal-close {
  flex-shrink: 0; background: none; border: none; cursor: pointer;
  padding: 5px; border-radius: 7px; color: #9CA3AF;
  transition: background .1s, color .1s;
}
.modal-close:hover { background: #F1F5F9; color: #374151; }
.modal-section-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: #9CA3AF; margin-bottom: 8px;
}

/* ── Empty state ─────────────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 20px; text-align: center;
}
.empty-state svg { color: #D1D5DB; margin-bottom: 14px; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.empty-state p { font-size: 13px; color: #9CA3AF; max-width: 280px; }

/* ── Responsive ──────────────────────────────────────────────────── */
@media (max-width: 700px) {
  #sidebar { width: 220px; }
  .cards-grid { grid-template-columns: 1fr; }
  #modal-box { max-height: 95vh; }
}
</style>
</head>
<body>

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const SHEET_ID   = '1QaLw_iyVNQgEHnGARKIEttw_ZvILMUheBzUeti_w3YA';
const REFRESH_MS = 5 * 60 * 1000;

// ── State ───────────────────────────────────────────────────────────────────
let emails          = [];
let industryMap       = {};   // brand.toLowerCase() → industry name
let industryOrder     = [];   // industry names in sheet order
let rawIndustryValues = [];   // flat list of values from the tab, in row order
let selectedCompany = null;
let searchQuery     = '';
let emailsReady     = false;
let industryReady   = false;
let indExpanded     = {};   // industry name → bool (default open)

// ── Helpers ─────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function stripHtml(html) {
  if (!html) return '';
  return html
    .replace(/<!--[\s\S]*?-->/g, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

function formatDate(raw) {
  if (!raw) return '';
  if (typeof raw === 'string' && raw.startsWith('Date(')) {
    const [y, m, d] = raw.slice(5, -1).split(',').map(Number);
    return `${String(m + 1).padStart(2,'0')}/${String(d).padStart(2,'0')}/${y}`;
  }
  const dt = new Date(raw);
  if (!isNaN(dt)) {
    return `${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}/${dt.getFullYear()}`;
  }
  return String(raw);
}

function parseDateTs(raw) {
  if (!raw) return 0;
  if (typeof raw === 'string' && raw.startsWith('Date(')) {
    const [y, m, d] = raw.slice(5, -1).split(',').map(Number);
    return new Date(y, m, d).getTime();
  }
  const dt = new Date(raw);
  return isNaN(dt) ? 0 : dt.getTime();
}

function trunc(str, len) {
  if (!str) return '';
  return str.length <= len ? str : str.slice(0, len) + '…';
}

function cellVal(cells, idx) {
  if (idx < 0 || !cells[idx] || cells[idx].v == null) return '';
  return cells[idx].v;
}

// ── Data Fetching ────────────────────────────────────────────────────────────

function injectScript(id, url) {
  const old = document.getElementById(id);
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = id; s.src = url;
  s.onerror = () => console.warn('[Dashboard] Script load failed:', id);
  document.head.appendChild(s);
}

function loadData() {
  emailsReady   = false;
  industryReady = false;
  injectScript('gviz-emails',
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:onEmailData&sheet=Email%20Screenshots`
  );
  injectScript('gviz-industries',
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:onIndustryData&sheet=Industry%20Categories`
  );
}

function checkReady() {
  if (!emailsReady || !industryReady) return;

  // Industry headers all contain " & " (e.g. "Health & Insurance"); company
  // names do not. Use that as the primary signal; empty rows are also separators
  // but GViz may omit them, so we don't rely on them exclusively.
  industryMap   = {};
  industryOrder = [];
  let currentInd = '';
  rawIndustryValues.forEach(value => {
    if (!value || value.toLowerCase() === 'categories') return;
    if (value.includes(' & ')) {
      currentInd = value;
      if (!industryOrder.includes(currentInd)) industryOrder.push(currentInd);
    } else if (currentInd) {
      industryMap[value.toLowerCase()] = currentInd;
    }
  });

  emails.forEach(e => {
    e.industry = industryMap[(e.brand || '').toLowerCase()] || 'Other';
  });
  renderAll();
}

// ── JSONP Callbacks ───────────────────────────────────────────────────────────

function onEmailData(resp) {
  try {
    if (resp.status && resp.status !== 'ok') {
      console.error('[Dashboard] Email data error:', resp);
      emailsReady = true; checkReady(); return;
    }
    const table = resp.table;
    const cols  = (table.cols || []).map(c => (c.label || '').trim());

    const iDate   = cols.indexOf('Date');
    const iSName  = cols.indexOf('Sender/ Name') !== -1 ? cols.indexOf('Sender/ Name') : cols.indexOf('Sender Name');
    const iSEmail = cols.indexOf('Sender/ Email') !== -1 ? cols.indexOf('Sender/ Email') : cols.indexOf('Sender Email');
    const iSubj   = cols.indexOf('Subject');
    const iBody   = cols.indexOf('Full Body Text');
    const iGmail  = cols.indexOf('Gmail Link');
    const iImgUrl = cols.indexOf('Image URLs');
    const iBrand  = cols.indexOf('Brand');
    const iShot   = cols.indexOf('Screenshot URL');
    const iApify  = cols.indexOf('Apify Run ID');

    emails = (table.rows || [])
      .filter(row => row && row.c && row.c.some(c => c && c.v != null && c.v !== ''))
      .map((row, i) => {
        const c = row.c || [];
        const v = idx => String(cellVal(c, idx)).trim();
        return {
          id:            i,
          date:          formatDate(cellVal(c, iDate)),
          dateTs:        parseDateTs(cellVal(c, iDate)),
          senderName:    v(iSName),
          senderEmail:   v(iSEmail),
          subject:       v(iSubj),
          body:          v(iBody),
          gmailLink:     v(iGmail),
          imageUrls:     v(iImgUrl),
          brand:         v(iBrand) || '(Unknown)',
          screenshotUrl: v(iShot),
          apifyRunId:    v(iApify),
          industry:      '',
        };
      });

    emailsReady = true;
    checkReady();
  } catch (err) {
    console.error('[Dashboard] onEmailData error:', err);
  }
}

function onIndustryData(resp) {
  try {
    if (resp.status && resp.status !== 'ok') {
      console.error('[Dashboard] Industry data error:', resp);
      industryReady = true; checkReady(); return;
    }
    // Preserve empty rows as '' so structural parsing in checkReady can use them
    // as group separators (empty row = next non-empty is an industry header)
    rawIndustryValues = (resp.table.rows || []).map(row => {
      if (!row || !row.c || !row.c[0] || row.c[0].v == null) return '';
      return String(row.c[0].v).trim();
    });

    industryReady = true;
    checkReady();
  } catch (err) {
    console.error('[Dashboard] onIndustryData error:', err);
  }
}

// ── Filtering ────────────────────────────────────────────────────────────────

function getFiltered() {
  let list = emails;
  if (selectedCompany) list = list.filter(e => e.brand === selectedCompany);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(e =>
      e.brand.toLowerCase().includes(q) ||
      e.industry.toLowerCase().includes(q) ||
      e.subject.toLowerCase().includes(q) ||
      stripHtml(e.body).toLowerCase().includes(q)
    );
  }
  return list.slice().sort((a, b) => b.dateTs - a.dateTs);
}

// ── Sidebar ──────────────────────────────────────────────────────────────────

function buildSidebar() {
  const el = document.getElementById('company-list');
  document.getElementById('sidebar-skel')?.remove();

  // Count emails per brand
  const counts = {};
  emails.forEach(e => { counts[e.brand] = (counts[e.brand] || 0) + 1; });

  // Group brands by industry (from actual email data)
  const groups = {};
  emails.forEach(e => {
    const ind = e.industry || 'Other';
    if (!groups[ind]) groups[ind] = new Set();
    groups[ind].add(e.brand);
  });

  // Industry order: sheet order first, then Other
  const orderedInds = [
    ...industryOrder.filter(i => groups[i]),
    ...(groups['Other'] ? ['Other'] : []),
  ];

  let html = `
    <div style="padding:4px 12px 8px;">
      <button class="company-btn all-btn ${!selectedCompany ? 'active' : ''}" onclick="selectCompany(null)">
        <span class="company-name">All Emails</span>
        <span class="company-count">${emails.length}</span>
      </button>
    </div>`;

  orderedInds.forEach(ind => {
    const brands = [...(groups[ind] || [])].sort();
    if (!brands.length) return;
    const isOpen = indExpanded[ind] !== false;
    const sid    = slug(ind);
    html += `
      <div class="ind-group">
        <div class="ind-header" data-ind="${esc(ind)}" onclick="toggleInd(this)">
          <span class="ind-label">${esc(ind)}</span>
          <span class="ind-chevron ${isOpen ? 'open' : ''}" id="chev-${sid}">▶</span>
        </div>
        <div id="ind-${sid}" style="${isOpen ? '' : 'display:none;'}">
          ${brands.map(brand => `
            <button class="company-btn ${selectedCompany === brand ? 'active' : ''}"
                    data-brand="${esc(brand)}" onclick="selectCompany(this.dataset.brand)">
              <span class="company-name">${esc(brand)}</span>
              <span class="company-count">${counts[brand] || 0}</span>
            </button>`).join('')}
        </div>
      </div>`;
  });

  el.innerHTML = html;
}

function toggleInd(header) {
  const ind  = header.dataset.ind;
  const sid  = slug(ind);
  const open = indExpanded[ind] !== false;
  indExpanded[ind] = !open;
  const body = document.getElementById('ind-' + sid);
  const chev = document.getElementById('chev-' + sid);
  if (body) body.style.display = open ? 'none' : '';
  if (chev) chev.classList.toggle('open', !open);
}

function selectCompany(name) {
  selectedCompany = name;
  renderAll();
}

function onSearch(val) {
  searchQuery = val.trim();
  renderAll();
}

function clearFilters() {
  selectedCompany = null;
  searchQuery     = '';
  const s = document.getElementById('search');
  if (s) s.value = '';
  renderAll();
}

// ── Render ───────────────────────────────────────────────────────────────────

function renderAll() {
  buildSidebar();
  renderFeed();
  // Update header
  const titleEl = document.getElementById('main-title');
  const subEl   = document.getElementById('main-sub');
  if (selectedCompany) {
    titleEl.textContent    = selectedCompany;
    const ind              = emails.find(e => e.brand === selectedCompany)?.industry || '';
    subEl.textContent      = ind && ind !== 'Other' ? ind : '';
    subEl.style.display    = (ind && ind !== 'Other') ? 'block' : 'none';
  } else if (searchQuery) {
    titleEl.textContent = 'Search results';
    subEl.textContent   = `"${searchQuery}"`;
    subEl.style.display = 'block';
  } else {
    titleEl.textContent = 'All Emails';
    subEl.style.display = 'none';
  }
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const list = getFiltered();

  document.getElementById('count-label').textContent =
    list.length + ' email' + (list.length !== 1 ? 's' : '');

  if (!list.length) {
    feed.innerHTML = `
      <div class="empty-state">
        <svg width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75
               m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243
               a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0
               L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
        </svg>
        <h3>${emails.length === 0 ? 'Loading data…' : 'No emails found'}</h3>
        <p>${
          emails.length === 0
            ? 'Make sure the sheet is shared as "Anyone with the link can view".'
            : searchQuery ? 'No emails match your search.' : 'No emails for this company.'
        }</p>
        ${(selectedCompany || searchQuery)
          ? '<button class="btn-ghost" onclick="clearFilters()" style="margin-top:14px;">Clear filters</button>'
          : ''}
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  list.forEach(e => grid.appendChild(buildCard(e)));
  feed.innerHTML = '';
  feed.appendChild(grid);
}

// ── Card Builder ─────────────────────────────────────────────────────────────

function buildCard(email) {
  const card = document.createElement('div');
  card.className = 'card';

  // Screenshot thumbnail
  if (email.screenshotUrl) {
    const wrap = document.createElement('div');
    wrap.className = 'card-thumb';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt     = '';
    img.src     = email.screenshotUrl;
    img.onerror = () => { wrap.style.display = 'none'; };
    wrap.appendChild(img);
    card.appendChild(wrap);
  }

  // Body
  const body = document.createElement('div');
  body.className = 'card-body';

  // Brand + date row
  const topRow = document.createElement('div');
  topRow.className = 'card-top';
  topRow.innerHTML = `
    <span class="card-brand">${esc(email.brand)}</span>
    <span class="card-date">${esc(email.date)}</span>`;
  body.appendChild(topRow);

  // Industry pill
  if (email.industry && email.industry !== 'Other') {
    const pill = document.createElement('span');
    pill.className   = 'pill';
    pill.textContent = email.industry;
    body.appendChild(pill);
  }

  // Subject
  const subj = document.createElement('div');
  subj.className   = 'card-subject';
  subj.textContent = email.subject || '(No subject)';
  body.appendChild(subj);

  // Body preview
  const preview = document.createElement('div');
  preview.className   = 'card-preview';
  preview.textContent = trunc(stripHtml(email.body), 50);
  body.appendChild(preview);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const btn = document.createElement('button');
  btn.className = 'btn-ghost';
  btn.innerHTML = `
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
    </svg>View More`;
  btn.onclick = () => openModal(email.id);
  actions.appendChild(btn);
  body.appendChild(actions);

  card.appendChild(body);
  return card;
}

// ── Skeleton ──────────────────────────────────────────────────────────────────

function showSkeletons() {
  const feed = document.getElementById('feed');
  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  for (let i = 0; i < 9; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animation = 'none';
    card.innerHTML = `
      <div class="skel" style="height:180px;border-radius:0;"></div>
      <div class="card-body" style="gap:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div class="skel" style="height:12px;width:45%;"></div>
          <div class="skel" style="height:12px;width:18%;"></div>
        </div>
        <div class="skel" style="height:10px;width:32%;"></div>
        <div class="skel" style="height:13px;"></div>
        <div class="skel" style="height:13px;width:78%;"></div>
        <div class="skel" style="height:10px;margin-top:2px;"></div>
        <div class="skel" style="height:10px;width:55%;"></div>
        <div style="padding-top:10px;border-top:1px solid #F1F5F9;">
          <div class="skel" style="height:30px;width:96px;border-radius:8px;"></div>
        </div>
      </div>`;
    grid.appendChild(card);
  }
  feed.innerHTML = '';
  feed.appendChild(grid);
}

// ── Modal ────────────────────────────────────────────────────────────────────

function openModal(id) {
  const e = emails.find(x => x.id === id);
  if (!e) return;

  document.getElementById('m-brand').textContent   = e.brand;
  document.getElementById('m-date').textContent    = e.date;
  document.getElementById('m-subject').textContent = e.subject || '(No subject)';

  const indEl = document.getElementById('m-industry');
  if (e.industry && e.industry !== 'Other') {
    indEl.textContent   = e.industry;
    indEl.style.display = 'inline-block';
  } else {
    indEl.style.display = 'none';
  }

  // Screenshot
  const shotWrap = document.getElementById('m-screenshot-wrap');
  const shotImg  = document.getElementById('m-screenshot');
  const shotLink = document.getElementById('m-screenshot-link');
  if (e.screenshotUrl) {
    shotImg.src            = e.screenshotUrl;
    shotLink.href          = e.screenshotUrl;
    shotWrap.style.display = 'block';
  } else {
    shotWrap.style.display = 'none';
  }

  // Body
  document.getElementById('m-body').textContent = stripHtml(e.body) || '(No body text)';

  // Gmail link
  const linkWrap = document.getElementById('m-link-wrap');
  const linkEl   = document.getElementById('m-link');
  if (e.gmailLink && e.gmailLink.startsWith('http')) {
    linkEl.href             = e.gmailLink;
    linkWrap.style.display  = 'block';
  } else {
    linkWrap.style.display = 'none';
  }

  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('modal-box').scrollTop = 0;
  document.addEventListener('keydown', onEsc);
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  document.removeEventListener('keydown', onEsc);
}

function onBgClick(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
}

function onEsc(e) {
  if (e.key === 'Escape') closeModal();
}

// ── Init ─────────────────────────────────────────────────────────────────────

showSkeletons();
loadData();
setInterval(loadData, REFRESH_MS);

</script>
